{% extends "base.html" %}

{% block title %}
ShopNex | Page Not Found
{% endblock %}

{% block content %}

<section class="error-page">
<link rel="stylesheet" href="{% static 'css/error.css' %}">
    <div class="error-content">

        <span>404</span>

        <h1>Page Not Found</h1>

        <p>
            The page you're looking for doesn't exist
            or may have been moved.
        </p>

        <a href="{% url 'home' %}">
            Back to ShopNex
        </a>

    </div>

</section>

{% endblock %}
