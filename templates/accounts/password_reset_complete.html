{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Updated | SHOPNEX</title>

    <link
        rel="stylesheet"
        href="{% static 'css/auth.css' %}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-visual">

        <div class="visual-overlay"></div>

        <div class="visual-content">

            <div class="shopnex-mark">
                <span>SHOP</span><b>NEX</b>
            </div>

            <div class="visual-icon success-icon">

                <i class="fa-solid fa-circle-check"></i>

            </div>

            <h1>
                You're all<br>
                <span>Set.</span>
            </h1>

            <p>
                Your ShopNex password has been
                successfully updated.
            </p>

        </div>

    </div>


    <div class="auth-form-side">

        <div class="auth-card">

            <div class="mobile-logo">
                <span>SHOP</span><b>NEX</b>
            </div>

            <div class="auth-icon success">

                <i class="fa-solid fa-circle-check"></i>

            </div>

            <h2>
                Password Updated
            </h2>

            <p class="auth-subtitle">

                Your password has been changed
                successfully. You can now log in
                using your new password.

            </p>


            <a
                href="{% url 'login' %}"
                class="auth-button"
            >

                Login to ShopNex

                <i class="fa-solid fa-arrow-right"></i>

            </a>

        </div>

    </div>

</div>

</body>

</html>
