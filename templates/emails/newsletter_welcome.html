<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Welcome to ShopNex</title>
</head>

<body style="
    margin:0;
    padding:0;
    background:#05070d;
    font-family:Arial, Helvetica, sans-serif;
">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;">

    <tr>
        <td align="center">

            <table
                width="600"
                cellpadding="0"
                cellspacing="0"
                style="
                    max-width:600px;
                    width:100%;
                    background:#0c1220;
                    border-radius:20px;
                    overflow:hidden;
                    border:1px solid #1e293b;
                "
            >

                <!-- HEADER -->

                <tr>
                    <td
                        style="
                            padding:35px 30px;
                            text-align:center;
                            background:#080d18;
                            border-bottom:1px solid #1e293b;
                        "
                    >

                        <h1
                            style="
                                margin:0;
                                color:#ffffff;
                                font-size:30px;
                                letter-spacing:-1px;
                            "
                        >
                            SHOP<span style="color:#3b82f6;">NEX</span>
                        </h1>

                        <p
                            style="
                                margin:10px 0 0;
                                color:#71819b;
                                font-size:13px;
                                letter-spacing:2px;
                            "
                        >
                            PREMIUM SHOPPING
                        </p>

                    </td>
                </tr>


                <!-- CONTENT -->

                <tr>

                    <td
                        style="
                            padding:45px 35px;
                            text-align:center;
                        "
                    >

                        <div
                            style="
                                width:70px;
                                height:70px;
                                line-height:70px;
                                margin:0 auto 25px;
                                border-radius:50%;
                                background:#3b82f6;
                                color:white;
                                font-size:30px;
                            "
                        >
                            ✓
                        </div>


                        <h2
                            style="
                                margin:0;
                                color:#ffffff;
                                font-size:27px;
                            "
                        >
                            You're officially subscribed!
                        </h2>


                        <p
                            style="
                                margin:18px auto 0;
                                max-width:450px;
                                color:#8ea0bb;
                                font-size:15px;
                                line-height:1.7;
                            "
                        >
                            Welcome to the ShopNex community.
                            You'll now be the first to know about
                            our latest products, exclusive offers
                            and special updates.
                        </p>


                        <!-- EMAIL -->

                        <div
                            style="
                                margin:30px 0;
                                padding:18px;
                                background:#080d18;
                                border:1px solid #1e293b;
                                border-radius:12px;
                                color:#ffffff;
                                font-size:14px;
                            "
                        >

                            {{ subscriber_email }}

                        </div>


                        <p
                            style="
                                margin:0;
                                color:#71819b;
                                font-size:13px;
                                line-height:1.6;
                            "
                        >
                            Thank you for choosing ShopNex.
                        </p>

                    </td>

                </tr>


                <!-- FOOTER -->

                <tr>

                    <td
                        style="
                            padding:25px;
                            text-align:center;
                            background:#080d18;
                            border-top:1px solid #1e293b;
                        "
                    >

                        <p
                            style="
                                margin:0;
                                color:#71819b;
                                font-size:12px;
                            "
                        >
                            © ShopNex. All rights reserved.
                        </p>

                    </td>

                </tr>

            </table>

        </td>
    </tr>

</table>

</body>
</html>
